<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MedCom - Multilingual Medical Communication App</title>
  <meta name="description" content="MedCom is a multilingual medical communication web app that helps patients and healthcare staff communicate through predefined translated medical phrases.">
  <meta name="robots" content="index, follow">
  <meta name="keywords" content="medical communication, multilingual healthcare app, patient translation, healthcare phrases">
  <link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ url_for('index') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
  <!-- Main header and top navigation -->
  <header class="header">
    <div class="header-inner">
      <div class="brand-block">
        <h1>MedCom</h1>
        <p class="subtitle">A medical communication app</p>
      </div>

      <nav class="topnav">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('info') }}">Info</a>
        <a href="{{ url_for('admin_login') }}">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Top control area:
         language selection and smart search are placed first
         because they are common entry points into the app -->
    <section class="top-dashboard">
      <!-- Language selection -->
      <section class="card compact-card">
        <h2>Languages</h2>
        <div class="grid-2">
          <div>
            <label for="patientLang">Patient language</label>
            <select id="patientLang"></select>
          </div>
          <div>
            <label for="staffLang">Staff language</label>
            <select id="staffLang"></select>
          </div>
        </div>
      </section>

      <!-- Smart search with optional voice input -->
      <section class="card compact-card">
        <h2>Smart Search</h2>
        <input
          id="smartSearch"
          class="input"
          placeholder="Type or say: pain, stomach, headache..."
        />

        <div class="voice-controls">
          <button id="startVoiceSearch" class="btn" type="button">Start voice search</button>
          <button id="stopVoiceSearch" class="btn btn-secondary" type="button">Stop</button>
        </div>

        <div id="voiceStatus" class="voice-status"></div>
        <div id="suggestions" class="chips"></div>
      </section>
    </section>

    <!-- Translation output:
         shows the currently selected phrase in both languages -->
    <section class="card">
      <h2>Translations</h2>

      <div class="grid-2">
        <div>
          <div class="label">Patient output</div>
          <div id="patientText" class="output"></div>
        </div>

        <div>
          <div class="label">Staff output</div>
          <div id="staffText" class="output"></div>
        </div>
      </div>

      <div class="actions">
        <button id="playAudio" class="btn" type="button">Play audio</button>
      </div>

      <audio id="audioPlayer" controls class="audio hidden"></audio>
    </section>

    <!-- Middle support area:
         word lookup and recent phrases are shown side by side
         to reduce vertical scrolling -->
    <section class="support-grid">
      <section class="card compact-card">
        <h2>Word Lookup</h2>
        <input id="wordSearch" class="input" placeholder="Search a word..." />
        <div id="wordResults" class="word-results"></div>
      </section>

      <section class="card compact-card">
        <h2>Recent Phrases</h2>
        <div id="recent" class="chips"></div>
      </section>
    </section>

    <!-- Phrase library:
         categories are shown below the main result area -->
    <section class="card">
      <h2>Phrases by Category</h2>
      <div id="categories"></div>
    </section>
  </main>

  <!-- Pass backend data to JavaScript -->
  <script>
    window.MEDCOM_DATA = {
      languages: {{ languages | tojson }},
      phrases: {{ phrases | tojson }},
      words: {{ words | tojson }}
    };
  </script>

  <!-- Main frontend logic -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
