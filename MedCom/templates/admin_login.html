<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MedCom - Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
  <!-- Login page header and navigation -->
  <header class="header">
    <h1>MedCom</h1>
    <p class="subtitle">Admin login</p>

    <nav class="topnav">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('info') }}">Info</a>
    </nav>
  </header>

  <main class="container">
    <!-- Flash messages: shows login errors or other status feedback -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <section class="card">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </section>
      {% endif %}
    {% endwith %}

    <!-- Admin login form -->
    <section class="card">
      <h2>Admin Access</h2>

      <form method="post">
        <label for="admin-username">Username</label>
        <input id="admin-username" class="input" type="text" name="username" required>

        <label for="admin-password">Password</label>
        <input id="admin-password" class="input" type="password" name="password" required>

        <!-- Accessibility fix applied here -->
        <label for="show-password" class="checkbox-label">
          <input 
            id="show-password" 
            type="checkbox" 
            onclick="togglePasswordVisibility()" 
            onkeypress="togglePasswordVisibility()" 
            onkeydown="togglePasswordVisibility()" 
            onkeyup="togglePasswordVisibility()"
          >
          Show password
        </label>

        <div class="actions">
          <button class="btn" type="submit">Log in</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    // Toggle password visibility when the checkbox is clicked or keyboard events occur
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('admin-password');
      const showPasswordCheckbox = document.getElementById('show-password');
      passwordInput.type = showPasswordCheckbox.checked ? 'text' : 'password';
    }
  </script>
</body>
</html>
